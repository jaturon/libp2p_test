<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>libp2p Chat — WebTransport Bridge</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg0: #0d1117;
      --bg1: #161b22;
      --bg2: #21262d;
      --border: #30363d;
      --accent: #58a6ff;
      --accent2: #3fb950;
      --danger: #f85149;
      --muted: #8b949e;
      --text: #e6edf3;
      --self-bg: #1c2d3f;
      --other-bg: #1e1e1e;
      --radius: 8px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --mono: 'Cascadia Code', 'Fira Mono', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg0);
      color: var(--text);
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    /* ── header ─────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: .75rem 1.25rem;
      background: var(--bg1);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.05rem; font-weight: 600; }
    header h1 span { color: var(--accent); }
    #status-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background .3s;
    }
    #status-dot.connected { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
    #status-dot.error     { background: var(--danger); }
    #status-label { font-size: .8rem; color: var(--muted); }
    #peer-count   { margin-left: auto; font-size: .8rem; color: var(--muted); }

    /* ── main layout ─────────────────────────────────────────────── */
    main {
      display: grid;
      grid-template-columns: 1fr 280px;
      overflow: hidden;
    }

    /* ── chat column ──────────────────────────────────────────────── */
    #chat-column {
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }

    #messages {
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: .6rem;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 72%;
      padding: .55rem .8rem;
      border-radius: var(--radius);
      background: var(--other-bg);
      word-break: break-word;
      line-height: 1.45;
    }
    .message.self { align-self: flex-end; background: var(--self-bg); }
    .message .meta {
      display: flex;
      align-items: baseline;
      gap: .5rem;
      margin-bottom: .25rem;
    }
    .message .nick  { font-size: .78rem; font-weight: 600; color: var(--accent); }
    .message.self .nick { color: var(--accent2); }
    .message .ts    { font-size: .7rem; color: var(--muted); }
    .message p      { font-size: .92rem; }

    /* ── message input ───────────────────────────────────────────── */
    #input-row {
      display: flex;
      gap: .5rem;
      padding: .75rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--bg1);
    }
    #msg-input {
      flex: 1;
      padding: .5rem .8rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: .93rem;
      outline: none;
      resize: none;
      height: 2.5rem;
      transition: border-color .2s;
    }
    #msg-input:focus { border-color: var(--accent); }
    #msg-input:disabled { opacity: .4; }

    button {
      padding: .45rem .9rem;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: .88rem;
      font-weight: 600;
      transition: opacity .2s, background .2s;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { opacity: .85; }
    .btn-send { background: var(--accent2); color: #fff; }
    .btn-send:hover:not(:disabled) { opacity: .85; }

    /* ── sidebar ─────────────────────────────────────────────────── */
    #sidebar {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* connect form */
    #connect-form {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: .6rem;
    }
    #connect-form label { font-size: .78rem; color: var(--muted); }
    #connect-form input, #connect-form textarea {
      width: 100%;
      padding: .45rem .6rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--mono);
      font-size: .72rem;
      outline: none;
      transition: border-color .2s;
    }
    #connect-form input:focus,
    #connect-form textarea:focus { border-color: var(--accent); }
    #addr-input {
      resize: vertical;
      min-height: 5.5rem;
      line-height: 1.4;
    }
    #connect-form input[type="text"] { font-family: var(--font); font-size: .85rem; }

    #browser-warning {
      display: none;
      color: var(--danger);
      font-size: .78rem;
      padding: .4rem .6rem;
      background: #2d1218;
      border: 1px solid var(--danger);
      border-radius: var(--radius);
    }

    /* event log */
    #log-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #log-title {
      padding: .5rem 1rem;
      font-size: .75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      border-bottom: 1px solid var(--border);
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: .5rem .75rem;
      display: flex;
      flex-direction: column;
      gap: .2rem;
    }
    .log-line {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
      word-break: break-all;
    }
    .log-line.info  { color: var(--accent); }
    .log-line.ok    { color: var(--accent2); }
    .log-line.error { color: var(--danger); }

    /* ── footer ─────────────────────────────────────────────────── */
    footer {
      padding: .4rem 1rem;
      font-size: .72rem;
      color: var(--muted);
      background: var(--bg1);
      border-top: 1px solid var(--border);
      text-align: center;
    }
    footer a { color: var(--accent); text-decoration: none; }

    /* ── scrollbar ───────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div id="status-dot"></div>
  <h1>libp2p Chat <span>/ WebTransport</span></h1>
  <span id="status-label">Disconnected</span>
  <span id="peer-count"></span>
</header>

<main>
  <!-- ── Left: chat ── -->
  <section id="chat-column">
    <div id="messages">
      <div class="message">
        <div class="meta">
          <span class="nick">system</span>
        </div>
        <p>Enter the gateway WebTransport multiaddr in the panel on the right, then click <strong>Connect</strong>.</p>
      </div>
    </div>

    <div id="input-row">
      <textarea id="msg-input" placeholder="Type a message… (Enter to send)" rows="1" disabled></textarea>
      <button id="send-btn" class="btn-send" disabled>Send</button>
    </div>
  </section>

  <!-- ── Right: sidebar ── -->
  <aside id="sidebar">
    <div id="connect-form">
      <div id="browser-warning">
        ⚠ WebTransport requires Chrome 97+ or Edge 97+.
      </div>

      <label for="addr-input">Gateway WebTransport multiaddr</label>
      <textarea id="addr-input" spellcheck="false"
        placeholder="/ip4/x.x.x.x/udp/4003/quic-v1/webtransport/certhash/…/p2p/12D3Koo…"></textarea>

      <label for="nick-input">Nickname</label>
      <input id="nick-input" type="text" placeholder="e.g. alice" maxlength="32" />

      <label for="topic-input">Topic</label>
      <input id="topic-input" type="text" value="libp2p_test-chat" />

      <button id="connect-btn" class="btn-primary">Connect</button>
    </div>

    <div id="log-section">
      <div id="log-title">Event log</div>
      <div id="log"></div>
    </div>
  </aside>
</main>

<footer>
  libp2p browser client &mdash;
  <a href="https://github.com/libp2p/js-libp2p" target="_blank" rel="noopener">js-libp2p</a>
  + WebTransport + GossipSub
</footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
